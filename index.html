<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>67 West RV Park — Executive Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <!-- Header / Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-slate-900 text-emerald-400 flex items-center justify-center font-bold text-lg shadow-sm">
          67W
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 tracking-tight leading-tight">67 West RV Park</h1>
          <p class="text-xs text-slate-500">Financial & Operations Management</p>
        </div>
      </div>

      <div class="flex items-center gap-3 ml-auto">
        <!-- Year Filter -->
        <div class="flex items-center gap-2">
          <label for="yearFilter" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Year</label>
          <select id="yearFilter" onchange="renderDashboard()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm rounded-lg px-3 py-1.5 font-medium border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
            <option value="ALL">All Time</option>
          </select>
        </div>

        <!-- Month Filter -->
        <div class="flex items-center gap-2">
          <label for="monthFilter" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Month</label>
          <select id="monthFilter" onchange="renderDashboard()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm rounded-lg px-3 py-1.5 font-medium border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
            <option value="ALL">All Months</option>
            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>
          </select>
        </div>

        <!-- Refresh Button -->
        <button onclick="fetchData()" id="refreshBtn" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium px-3 py-1.5 rounded-lg border border-slate-200 transition">
          <i class="fa-solid fa-rotate-right" id="refreshIcon"></i>
          <span class="hidden sm:inline">Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- Loading State -->
    <div id="loadingState" class="flex flex-col items-center justify-center py-24 space-y-4">
      <div class="w-12 h-12 border-4 border-slate-200 border-t-emerald-600 rounded-full animate-spin"></div>
      <p class="text-slate-500 font-medium text-sm animate-pulse">Syncing with Google Sheets...</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden bg-red-50 border border-red-200 text-red-700 px-6 py-4 rounded-xl flex items-center gap-3 text-sm">
      <i class="fa-solid fa-circle-exclamation text-lg text-red-500"></i>
      <div id="errorMessage">Failed to load data. Please verify your Apps Script URL.</div>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboardContent" class="hidden space-y-8">

      <!-- Primary KPI Cards -->
      <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
        <!-- Operating Revenue -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <div class="flex items-center justify-between text-slate-500 text
